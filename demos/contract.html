        <div class="dc-c"><div class="dc-st"><h3>جدول تفاصيل الصرف<span>Financial details table</span></h3>
            <div style="display:flex;gap:8px;flex-wrap:wrap"><input id="dcQ" placeholder="بحث في الجدول…" style="font:inherit;font-size:13px;border:1px solid #D6DEE7;border-radius:9px;padding:7px 10px"></div></div>
          <div class="dc-tw" style="margin-top:10px"><table><thead><tr><th id="dcSort">التاريخ ▾</th><th>الشهر</th><th>رقم العقد</th><th>المسار</th><th>قيمة الإنجاز</th><th>الشهادة</th></tr></thead><tbody id="dcBody"></tbody></table></div>
          <div class="dc-pg" id="dcPg"></div></div>
        <div class="dc-c"><div class="dc-st"><h3>شهادات الإنجاز<span>Completion certificates — select a month to see its invoice lines</span></h3></div>
          <p id="dcMiss" style="margin:10px 0 0;font-size:13px;color:#33465E"></p>
          <div class="dc-certs" id="dcCerts" style="margin-top:12px"></div><div style="margin-top:10px"><button class="dc-btn" id="dcMore" type="button"></button></div><div id="dcDet"></div></div>
      </div></div>`;
    const q = (id) => root.querySelector('#' + id);
    const rowsF = () => C.monthly.filter((r) => (st.year === 'all' || r.year == st.year) && (st.line === 'all' || r.line === st.line) && (st.month === 'all' || r.month == st.month));

    function chart() {
      const rs = rowsF();
      const ms = months.filter((m) => rs.some((r) => r.date === m));
      const W = 560, H = 250, pl = 64, pr = 12, pt = 14, pb = 34;
      if (!ms.length) { q('dcChart1').innerHTML = q('dcChart2').innerHTML = q('dcGauge').innerHTML = '<p style="color:#6B7A8C;font-size:13px">لا توجد بيانات لهذا الاختيار.</p>'; return; }
      const byLine = (m, id) => rs.filter((r) => r.date === m && r.line === id).reduce((a, r) => a + r.amount, 0);
      const A = ms.map((m) => byLine(m, 'A')), B = ms.map((m) => byLine(m, 'B'));
      const mon = ms.map((_, i) => A[i] + B[i]);
      let run = 0; const cum = mon.map((v) => (run += v));
      const step = Math.ceil(ms.length / 7);
      const xlab = (x) => ms.map((m, i) => (i % step ? '' : `<text x="${x(i)}" y="${H - 12}" text-anchor="middle">${EN_M[+m.slice(5, 7) - 1]} ${m.slice(2, 4)}</text>`)).join('');
      const grid = (y, max, unit) => { let g = ''; for (let k = 0; k <= 4; k++) { const v = (max * k) / 4; g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#EEF1F5"/><text x="${pl - 6}" y="${y(v) + 3}" text-anchor="end">${unit(v)}</text>`; } return g; };
      // monthly stacked
      const m1 = Math.max(...mon) * 1.15;
      const x = (i) => pl + ((W - pl - pr) * (i + 0.5)) / ms.length, y1 = (v) => pt + (H - pt - pb) * (1 - v / m1);
      const bw = Math.max(5, ((W - pl - pr) / ms.length) * 0.62);
      const bars = ms.map((m, i) => `<rect x="${x(i) - bw / 2}" y="${y1(A[i])}" width="${bw}" height="${y1(0) - y1(A[i])}" fill="#0E2340"><title>${m} · ${n0(A[i])} SAR</title></rect>`
        + `<rect x="${x(i) - bw / 2}" y="${y1(A[i] + B[i])}" width="${bw}" height="${y1(0) - y1(B[i])}" rx="2" fill="#B08A3E"><title>${m} · ${n0(B[i])} SAR</title></rect>`).join('');
      q('dcChart1').innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="direction:ltr;max-width:100%">${grid(y1, m1 / 1.15, (v) => (v / 1e3).toFixed(0) + 'K')}${bars}${xlab(x)}</svg>`;
      // cumulative
      const showCap = st.year === 'all' && st.month === 'all' && st.line === 'all';
      const m2 = Math.max(showCap ? C.value : 0, cum[cum.length - 1]) * 1.08;
      const y2 = (v) => pt + (H - pt - pb) * (1 - v / m2);
      const path = cum.map((v, i) => `${i ? 'L' : 'M'}${x(i)},${y2(v)}`).join('');
      const area = `${path} L${x(cum.length - 1)},${y2(0)} L${x(0)},${y2(0)} Z`;
      const cap = showCap ? `<line x1="${pl}" x2="${W - pr}" y1="${y2(C.value)}" y2="${y2(C.value)}" stroke="#B08A3E" stroke-dasharray="5 4"/><text x="${W - pr}" y="${y2(C.value) - 5}" text-anchor="end" fill="#B08A3E">${(C.value / 1e6).toFixed(1)}M</text>` : '';
      const li = cum.length - 1;
      q('dcChart2').innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="direction:ltr;max-width:100%">${grid(y2, m2 / 1.08, (v) => (v / 1e6).toFixed(1) + 'M')}${cap}
        <path d="${area}" fill="#1E6F6A" fill-opacity=".12"/><path d="${path}" fill="none" stroke="#1E6F6A" stroke-width="2.2"/>
        <circle cx="${x(li)}" cy="${y2(cum[li])}" r="4.5" fill="#1E6F6A"/><text x="${x(li) - 8}" y="${y2(cum[li]) - 9}" text-anchor="end" fill="#13233A" style="font-weight:600">${(cum[li] / 1e6).toFixed(2)}M</text>${xlab(x)}</svg>`;
      // gauge (filtered spend share of contract value)
      const sp = rs.reduce((a, r) => a + r.amount, 0), p = Math.min(1, sp / C.value);
      const R = 90, cx = 120, cy = 112, a0 = Math.PI, a1 = Math.PI * (1 - p);
      const arc = (a) => `${cx + R * Math.cos(a)},${cy - R * Math.sin(a)}`;
      q('dcGauge').innerHTML = `<svg viewBox="0 0 240 150" width="100%" style="max-width:340px;display:block;margin:10px auto 0;direction:ltr">
        <path d="M${arc(a0)} A${R},${R} 0 0 1 ${arc(0)}" fill="none" stroke="#EEF1F5" stroke-width="24"/>
        <path d="M${arc(a0)} A${R},${R} 0 0 1 ${arc(a1)}" fill="none" stroke="#1E7A52" stroke-width="24"/>
        <text x="${cx}" y="${cy - 8}" text-anchor="middle" style="font-size:26px;font-weight:700;fill:#1E7A52">${(p * 100).toFixed(1)}%</text>
        <text x="${cx}" y="${cy + 14}" text-anchor="middle" style="font-size:10.5px">${n0(sp)} / ${n0(C.value)} SAR</text></svg>
        <p style="text-align:center;font-size:12.5px;color:#6B7A8C;margin:4px 0 0">من إجمالي قيمة العقد للاختيار الحالي</p>`;
    }
    function table() {
      let rs = rowsF().filter((r) => !st.q || (lineName[r.line] + AR_M[r.month - 1] + r.date + r.amount).includes(st.q));
      rs = rs.slice().sort((a, b) => (st.sortDesc ? -1 : 1) * (a.date.localeCompare(b.date) || a.line.localeCompare(b.line)));
      const pages = Math.max(1, Math.ceil(rs.length / 10)); st.page = Math.min(st.page, pages - 1);
      q('dcBody').innerHTML = rs.slice(st.page * 10, st.page * 10 + 10).map((r) => `<tr><td>${r.date}</td><td>${AR_M[r.month - 1]} ${r.year}</td>
        <td style="font-family:'IBM Plex Mono',monospace;font-size:12px">${C.lines.find((l) => l.id === r.line).no}</td><td>${esc(lineName[r.line])}</td>
        <td class="m">${n0(r.amount)} SAR</td><td>${r.certificate ? '<span class="dc-pill">مرفقة</span>' : '<span class="dc-pill r">ناقصة</span>'}</td></tr>`).join('') || '<tr><td colspan="6" style="color:#6B7A8C">لا توجد نتائج</td></tr>';
      q('dcSort').textContent = 'التاريخ ' + (st.sortDesc ? '▾' : '▴');
      q('dcPg').innerHTML = `<span>عرض ${rs.length ? st.page * 10 + 1 : 0}–${Math.min(rs.length, st.page * 10 + 10)} من ${rs.length}</span>` +
        Array.from({ length: pages }, (_, i) => `<button class="dc-btn" type="button" data-pg="${i}" aria-current="${i === st.page}">${i + 1}</button>`).join('');
    }
    function certs() {
      const rsAll = rowsF().slice().sort((a, b) => b.date.localeCompare(a.date) || a.line.localeCompare(b.line));
      const rs = st.allCerts ? rsAll : rsAll.slice(0, 12);
      const missing = rsAll.filter((r) => !r.certificate);
      q('dcMiss').innerHTML = missing.length ? `<span class="dc-pill r">${missing.length} أشهر بلا شهادة</span> ` + missing.map((r) => `${AR_M[r.month - 1]} ${r.year} (${r.line === 'A' ? 'المسار أ' : 'المسار ب'})`).join(' · ') : '<span class="dc-pill">لا توجد شهادات ناقصة</span>';
      q('dcMore').hidden = rsAll.length <= 12; q('dcMore').textContent = st.allCerts ? 'عرض أقل' : `عرض كل الشهادات (${rsAll.length})`;
      q('dcCerts').innerHTML = rs.map((r) => {
        const key = `${r.date.slice(0, 7)}-${r.line}`;
        const pv = r.certificate ? `<svg viewBox="0 0 120 76" width="100%" height="76"><rect x="1" y="1" width="118" height="74" fill="#fff" stroke="#D6DEE7"/><rect x="8" y="7" width="40" height="5" fill="#0E2340"/><rect x="78" y="7" width="34" height="5" fill="#C7A35A"/>${[0, 1, 2, 3, 4].map((k) => `<line x1="8" x2="112" y1="${22 + k * 10}" y2="${22 + k * 10}" stroke="#E1E7EE"/><rect x="${70 - (k % 3) * 6}" y="${16 + k * 10}" width="${30 + (k % 3) * 6}" height="3" fill="#9AA8B8"/>`).join('')}<circle cx="100" cy="64" r="7" fill="none" stroke="#1E7A52"/></svg>` : 'لم تُرفق الشهادة بعد';
        return `<button class="dc-cert" type="button" data-key="${key}" aria-pressed="${st.sel === key}"><div class="pv ${r.certificate ? '' : 'miss'}">${pv}</div>
          <div class="cap"><b>${AR_M[r.month - 1]} ${r.year}</b><span>${C.lines.find((l) => l.id === r.line).no}</span></div></button>`;
      }).join('');
      const det = st.sel && C.invoices[st.sel];
      q('dcDet').innerHTML = det ? `<div class="dc-det"><b style="font-size:14px">بنود الفاتورة ${esc(det[0][3])}</b><div class="dc-tw"><table style="margin-top:8px"><thead><tr><th>البند</th><th>المبلغ شامل الضريبة</th></tr></thead><tbody>
        ${det.map((d) => `<tr><td>${esc(d[0])}</td><td class="m">${n0(d[2])} SAR</td></tr>`).join('')}
        <tr><td><b>الإجمالي</b></td><td class="m">${n0(det.reduce((a, d) => a + d[2], 0))} SAR</td></tr></tbody></table></div></div>` : '';
    }
    const all = () => { chart(); table(); certs(); };
    q('dcY').onchange = (e) => { st.year = e.target.value; st.page = 0; all(); };
    q('dcL').onchange = (e) => { st.line = e.target.value; st.page = 0; all(); };
    q('dcM').onchange = (e) => { st.month = e.target.value; st.page = 0; all(); };
    q('dcReset').onclick = () => { st.year = st.line = st.month = 'all'; st.q = ''; q('dcY').value = q('dcL').value = q('dcM').value = 'all'; q('dcQ').value = ''; all(); };
    q('dcQ').oninput = (e) => { st.q = e.target.value.trim(); st.page = 0; table(); };
    q('dcSort').onclick = () => { st.sortDesc = !st.sortDesc; table(); };
    q('dcPg').onclick = (e) => { const b = e.target.closest('[data-pg]'); if (b) { st.page = +b.dataset.pg; table(); } };
    q('dcCerts').onclick = (e) => { const b = e.target.closest('[data-key]'); if (b) { st.sel = st.sel === b.dataset.key ? null : b.dataset.key; certs(); } };
    q('dcMore').onclick = () => { st.allCerts = !st.allCerts; certs(); };
    all();
  }

  return { contract, _stop: stop };
})();
</script>
<script>
(function () {
  const mount = document.getElementById('demoMount');
  try { window.DEMOS.contract(mount); }
  catch (e) { mount.textContent = 'Demo failed to load: ' + e.message; console.error(e); }
})();
</script>
</body>
