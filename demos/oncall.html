      <div class="do-card do-mfm"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><h3>MFM cover</h3><span class="sub">Counted in days, week by week — kept out of the duty totals above.</span></div><div id="doMfm"></div></div>
    </div>`;
    const q = (id) => root.querySelector('#' + id);
    function race() {
      const k = st.k, val = (p) => (st.mode === 'rota' ? p.per[k] : p.per.slice(0, k + 1).reduce((a, b) => a + b, 0));
      const list = active.slice().sort((a, b) => val(b) - val(a) || a.n.localeCompare(b.n)).slice(0, 10);
      const max = val(list[0]) || 1;
      q('doCur').textContent = `ROTA ${k + 1} OF ${P.length} · ${P[k].toUpperCase()}   ${val(list[0])} duties · ${list[0].r.toLowerCase()} · ${st.mode === 'rota' ? 'this rota' : 'running total'}`;
      q('doBig').textContent = list[0].n;
      q('doRace').innerHTML = list.map((p, i) => `<div class="r"><span class="mono" style="color:#7FD1D4">${i + 1}</span><span class="nm">${p.n}</span><span class="tr"><i style="width:${(val(p) / max) * 100}%"></i></span><span class="mono">${val(p)}</span></div>`).join('');
      q('doRange').value = k;
      q('doChips').innerHTML = P.map((l, i) => { const tp = topOf(i); return `<button type="button" data-k="${i}" aria-current="${i === k}"><span class="mono">${l.toUpperCase()}</span><b>${short(tp.n)}</b><span class="mono">${tp.per[i]} duties</span></button>`; }).join('');
      q('doBlocks').innerHTML = P.map((l, i) => { const mx = Math.max(...per); const tp = topOf(i); return `<button type="button" data-k="${i}" aria-current="${i === k}" title="${l}: ${per[i]} duties"><span class="n mono">${per[i]}</span><i class="${R.periods[i].kind === 'eid' ? 'e' : ''}" style="height:${(per[i] / mx) * 120}px"></i><span class="l">${l}<br>▲ ${tp.n.split(' ')[0]}</span></button>`; }).join('');
    }
    function list() {
      let ls = active.filter((p) => (st.role === 'all' || p.r === st.role) && (!st.q || p.n.toLowerCase().includes(st.q.toLowerCase())));
      ls.sort(st.sort === 'az' ? (a, b) => a.n.localeCompare(b.n) : (a, b) => b.tot - a.tot || a.n.localeCompare(b.n));
      const max = Math.max(1, ...active.map((p) => p.tot));
      q('doList').innerHTML = ls.map((p, i) => `<button class="do-li" type="button" data-n="${esc(p.n)}" aria-current="${p.n === st.sel}"><span class="rk mono">${i + 1}</span><span class="nm">${p.n}</span><span class="ct">${p.tot}</span><span class="tr"><i style="width:${(p.tot / max) * 100}%"></i></span></button>`).join('') || '<p class="sub">No match.</p>';
    }
    function profile() {
      const p = people.find((x) => x.n === st.sel);
      const rank = active.slice().sort((a, b) => b.tot - a.tot).findIndex((x) => x.n === p.n) + 1;
      const topped = P.filter((_, i) => topOf(i).n === p.n);
      const mx = Math.max(1, ...p.per); const pk = p.per.indexOf(Math.max(...p.per));
      const kinds = R.duties.map((d, i) => [d, p.duty[i], DCOL[i]]).filter((x) => x[1] > 0);
      const mf = R.mfm.filter((w) => w.name === p.n).reduce((a, w) => a + days(w), 0);
      q('doPf').innerHTML = `<span class="role">${p.r.toUpperCase()}</span><h3>${p.n}</h3>
        <div class="st"><div><b class="mono">${p.tot}</b><span>DUTIES</span></div><div><b class="mono">#${rank}</b><span>RANK</span></div><div><b class="mono">${(p.tot / P.length).toFixed(1)}</b><span>PER ROTA</span></div><div><b class="mono">${topped.length}</b><span>ROTAS TOPPED</span></div>${mf ? `<div><b class="mono">${mf}</b><span>MFM DAYS</span></div>` : ''}</div>
        <p class="sub" style="letter-spacing:.08em">ROTA BY ROTA — PEAK ${p.per[pk]} IN ${P[pk].toUpperCase()}</p>
        <div class="do-mini">${p.per.map((v, i) => `<i class="${R.periods[i].kind === 'eid' ? 'e' : ''}" style="height:${Math.max(2, (v / mx) * 66)}px;${i === pk ? 'background:#13201F' : ''}" title="${P[i]}: ${v}"></i>`).join('')}</div>
        <div class="do-mx mono">${p.per.map((v) => `<span>${v}</span>`).join('')}</div>
        <p class="sub" style="letter-spacing:.08em;margin-top:14px">KIND OF SHIFT</p>
        <div class="do-kind">${kinds.map(([d, v, c]) => `<i style="width:${(v / p.tot) * 100}%;background:${c}" title="${d}: ${v}"></i>`).join('')}</div>
        <div class="do-kl">${kinds.map(([d, v, c]) => `<span><i style="background:${c}"></i>${d} <b class="mono">${v}</b></span>`).join('')}</div>
        <p class="sub" style="margin-top:12px;border-top:1px solid #E2E9E9;padding-top:10px">${topped.length ? 'Topped the rota in ' + topped.join(', ') + '.' : 'Did not top any single rota.'}</p>`;
    }
    function dtypes() {
      const tot = R.duties.map((d, i) => [d, people.reduce((a, p) => a + p.duty[i], 0), DCOL[i]]).sort((a, b) => b[1] - a[1]);
      q('doDt').innerHTML = tot.map(([d, v, c]) => `<div><b><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${c};margin-right:6px"></i>${d}</b><div class="v mono">${v}</div><p>${DDESC[d]} ${((v / total) * 100).toFixed(1)}% of all duties.</p></div>`).join('');
      const t0 = new Date(R.periods[0].start), t1 = new Date(R.periods[R.periods.length - 1].end), span = t1 - t0;
      const team = [...new Set(R.mfm.map((w) => w.name))]; const col = ['#1F8A8F', '#B79A6A', '#13201F'];
      q('doMfm').innerHTML = team.map((n, i) => `<div class="row"><span>${n.split(' ')[0]}</span><span class="lane">${R.mfm.filter((w) => w.name === n).map((w) => `<i style="left:${((new Date(w.from) - t0) / span) * 100}%;width:${(days(w) / (span / 864e5)) * 100}%;background:${col[i]}" title="${w.from} → ${w.to}"></i>`).join('')}</span><b class="mono">${R.mfm.filter((w) => w.name === n).reduce((a, w) => a + days(w), 0)} d</b></div>`).join('')
        + `<div class="row"><span></span><span class="do-mx mono">${['Jan', 'Mar', 'May', 'Jul', 'Sep', 'Nov'].map((m) => `<span>${m}</span>`).join('')}</span><span></span></div>`;
    }
    function tick() { if (!st.playing) return; st.k = (st.k + 1) % P.length; race(); }
    function setPlay(v) { st.playing = v; q('doPlay').textContent = v ? '❚❚ Pause' : '▶ Play'; }
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) setPlay(false);
    timers.push(setInterval(tick, 2200));
    q('doPlay').onclick = () => setPlay(!st.playing);
    q('doPrev').onclick = () => { setPlay(false); st.k = (st.k - 1 + P.length) % P.length; race(); };
    q('doNext').onclick = () => { setPlay(false); st.k = (st.k + 1) % P.length; race(); };
    q('doRange').oninput = (e) => { setPlay(false); st.k = +e.target.value; race(); };
    root.querySelector('.do-seg').onclick = (e) => { const b = e.target.closest('[data-mode]'); if (!b) return; st.mode = b.dataset.mode; root.querySelectorAll('.do-seg button').forEach((x) => x.setAttribute('aria-pressed', x === b)); race(); };
    const pick = (e) => { const b = e.target.closest('[data-k]'); if (b) { setPlay(false); st.k = +b.dataset.k; race(); } };
    q('doChips').onclick = pick; q('doBlocks').onclick = pick;
    q('doTabs').onclick = (e) => { const b = e.target.closest('[data-role]'); if (!b) return; st.role = b.dataset.role; q('doTabs').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b)); list(); };
    q('doQ').oninput = (e) => { st.q = e.target.value.trim(); list(); };
    q('doSort').onchange = (e) => { st.sort = e.target.value; list(); };
    q('doList').onclick = (e) => { const b = e.target.closest('[data-n]'); if (b) { st.sel = b.dataset.n; list(); profile(); } };
    race(); list(); profile(); dtypes();
  }

  return { oncall, _stop: stop };
})();
</script>
<script>
(function () {
  const mount = document.getElementById('demoMount');
  try { window.DEMOS.oncall(mount); }
  catch (e) { mount.textContent = 'Demo failed to load: ' + e.message; console.error(e); }
})();
</script>
</body>
