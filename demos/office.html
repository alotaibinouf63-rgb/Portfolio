<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة تشغيل المكتب الإداري</title>
<meta name="description" content="Interactive demo by Nouf Al Otaibi: administrative office operations board (illustrative figures).">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230E2445%22/%3E%3Ctext x=%2232%22 y=%2241%22 text-anchor=%22middle%22 font-family=%22Arial,sans-serif%22 font-size=%2224%22 font-weight=%22700%22 fill=%22%23fff%22%3ENA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap">
<style>
/* Page shell — same base rules the portfolio applies around its demo window. */
*{box-sizing:border-box}
html,body{margin:0}
body{background:#0D1A17;color:#15202A;font-family:'IBM Plex Sans Arabic','IBM Plex Sans','Segoe UI',Tahoma,sans-serif;font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #1B5B70;outline-offset:2px;border-radius:4px}
.mono{font-family:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div id="demoMount" lang="ar"></div>

<script>
/* Interactive demo recreation, extracted from Nouf Al Otaibi's portfolio. Data is synthetic. */
window.DEMOS = (function () {
  const DD = window.DEMO_DATA;
  const LOGO = (window.ASSETS && window.ASSETS['assets/sfh-logo.png']) || 'assets/sfh-logo.png';
  const AR_M = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
  const EN_M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const n0 = (v) => Math.round(v).toLocaleString('en-US');
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let timers = [];
  function stop() { timers.forEach(clearInterval); timers = []; }
  function addStyle(id, css) {
    if (document.getElementById(id)) return;
    const s = document.createElement('style'); s.id = id; s.textContent = css; document.head.appendChild(s);
  }

  /* ================================================================ OFFICE OPS */
  function office(root) {
    addStyle('dx-css', `
.dx{direction:rtl;font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;background:radial-gradient(120% 80% at 100% 0,#163029,#0D1A17 60%);color:#E4EEEA;padding:22px;min-height:100%;line-height:1.5}
.dx *{box-sizing:border-box}.dx .mono{font-family:'IBM Plex Mono',monospace}
.dx-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid #22382F;margin-bottom:18px}
.dx-h .om{width:48px;height:48px;border-radius:12px;background:linear-gradient(140deg,#35C792,#1E8F68);display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-weight:700;color:#0D1A17}
.dx-h h2{margin:0;font-size:21px}.dx-h p{margin:0;color:#8FA79D;font-size:13px}
.dx-h .live{margin-inline-start:auto;border:1px solid #2FBF8F;border-radius:999px;padding:5px 14px;font-size:12.5px;color:#9EE6C8;display:flex;gap:8px;align-items:center}.dx-h .live i{width:8px;height:8px;border-radius:50%;background:#2FBF8F;box-shadow:0 0 0 0 rgba(47,191,143,.6);animation:dxp 2s infinite}
@keyframes dxp{70%{box-shadow:0 0 0 8px rgba(47,191,143,0)}100%{box-shadow:0 0 0 0 rgba(47,191,143,0)}}
.dx-c{background:#13241F;border:1px solid #22382F;border-radius:14px;padding:16px}
.dx-k{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.dx-k .dx-c{border-inline-start:3px solid #2FBF8F}.dx-k b{font-size:13px;color:#A9C0B6;font-weight:500}.dx-k .v{font-size:30px;font-weight:700;margin:6px 0;font-family:'IBM Plex Mono',monospace}.dx-k .v small{font-size:13px;color:#8FA79D;margin-inline-start:4px}
.dx-k .d{font-size:12px;color:#5FD3A6}.dx-k .d.w{color:#E7B76A}
.dx-2>*,.dx-3>*{min-width:0}.dx-2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px;margin-bottom:14px}@media(max-width:820px){.dx-2,.dx-3{grid-template-columns:1fr!important}}
.dx-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dx h3{margin:0;font-size:15px}.dx .sub{font-size:12px;color:#7F978D}
.dx-bars{display:flex;align-items:flex-end;gap:14px;height:180px;margin-top:14px;padding-inline:4px}
.dx-bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.dx-bars i{width:100%;max-width:62px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,#38D39C,#1E8F68);position:relative}
.dx-bars i s{position:absolute;bottom:0;left:0;right:0;background:#2A4A3F;border-radius:0 0 3px 3px;text-decoration:none}
.dx-bars span{font-size:11px;color:#7F978D}.dx-bars em{font-style:normal;font-size:11px;font-family:'IBM Plex Mono',monospace;color:#CFE3DA}
.dx-task{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #1F332C;font-size:14px}
.dx-task button{font:inherit;font-size:11.5px;border-radius:999px;padding:3px 12px;cursor:pointer;border:1px solid #2C5A49;background:#173A2E;color:#7DE0B8;white-space:nowrap}
.dx-task button.w{background:#3A2F18;border-color:#5C4A22;color:#E7B76A}
.dx-flow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14px}.dx-flow i{width:20px;height:20px;border-radius:6px;background:#173A2E;color:#5FD3A6;display:grid;place-items:center;font-style:normal;font-size:12px}
.dx-ring{display:flex;align-items:center;gap:16px;margin-top:12px}.dx-ring b{display:block;font-size:14px}.dx-ring span{font-size:12px;color:#7F978D}
.dx-note{margin-top:14px;font-size:12px;color:#7F978D;text-align:center}
`);
    const months = ['مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس'];
    const auto = [0, 46, 58, 66, 79, 94], manual = [72, 61, 52, 44, 35, 27];
    const tasks = [['مطابقة فواتير الموردين', true], ['تحديث جدول المناوبات', true], ['إشعار تجديد عقد صيانة', false], ['أرشفة محاضر الاجتماعات', true], ['تقرير المخزون الأسبوعي', false], ['متابعة طلبات المستلزمات المكتبية', false]];
    const ring = (p, c) => { const r = 34, L = 2 * Math.PI * r; return `<svg width="86" height="86" viewBox="0 0 86 86"><circle cx="43" cy="43" r="${r}" fill="none" stroke="#1F332C" stroke-width="9"/><circle cx="43" cy="43" r="${r}" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${L * p} ${L}" transform="rotate(-90 43 43)"/><text x="43" y="48" text-anchor="middle" fill="#E4EEEA" style="font:700 15px 'IBM Plex Mono',monospace">${Math.round(p * 100)}%</text></svg>`; };
    const mx = Math.max(...auto.map((a, i) => a + manual[i]));
    root.innerHTML = `<div class="dx">
      <div class="dx-h"><div class="om">OM</div><div><h2>لوحة تشغيل المكتب الإداري</h2><p>مستشفى قوى الأمن — إدارة العمليات · إعداد نوف العتيبي</p></div><span class="live"><i></i>محدّثة الآن</span></div>
      <div class="dx-k">
        <div class="dx-c"><b>نسبة الأتمتة</b><div class="v">74<small>%</small></div><span class="d">↑ 19% منذ بداية العام</span></div>
        <div class="dx-c"><b>متوسط زمن إنجاز الطلب</b><div class="v">5.1<small>ساعة</small></div><span class="d">↓ 28% مقارنة بالنظام اليدوي</span></div>
        <div class="dx-c"><b>الوثائق المؤرشفة رقمياً</b><div class="v">2,760<small>ملف</small></div><span class="d">↑ 385 هذا الشهر</span></div>
        <div class="dx-c"><b>التزام الموردين بالعقود</b><div class="v">94<small>%</small></div><span class="d w">مراجعة 3 عقود قيد الانتظار</span></div>
      </div>
      <div class="dx-2">
        <div class="dx-c"><h3>حجم المهام المؤتمتة مقابل اليدوية</h3><span class="sub">آخر 6 أشهر · الجزء الداكن = يدوي</span>
          <div class="dx-bars">${months.map((m, i) => `<div><em>${auto[i] + manual[i]}</em><i style="height:${((auto[i] + manual[i]) / mx) * 140}px" title="مؤتمت ${auto[i]} · يدوي ${manual[i]}"><s style="height:${(manual[i] / (auto[i] + manual[i])) * 100}%"></s></i><span>${m}</span></div>`).join('')}</div></div>
        <div class="dx-c"><h3>مهام اليوم</h3><span class="sub">اضغطي على الحالة لتغييرها</span><div id="dxTasks" style="margin-top:6px"></div></div>
      </div>
      <div class="dx-3">
        <div class="dx-c"><h3>توفير الوقت الإداري</h3><div class="dx-ring">${ring(0.62, '#2FBF8F')}<div><b>ساعات مسترجعة</b><span>تُعاد توجيهها لمهام استراتيجية</span></div></div></div>
        <div class="dx-c"><h3>مسارات مؤتمتة نشطة</h3>${['تتبع طلبات الصيانة', 'تذكير تجديد العقود', 'تصنيف الوثائق الواردة', 'تقارير الأداء الشهرية'].map((f) => `<div class="dx-flow"><span>${f}</span><i>✓</i></div>`).join('')}</div>
        <div class="dx-c"><h3>رضا الفرق الداخلية</h3><div class="dx-ring">${ring(0.88, '#38D39C')}<div><b>تقييم إيجابي</b><span>بناءً على استبيان ربع سنوي</span></div></div></div>
      </div>
      <p class="dx-note">جميع الأرقام في هذا النموذج توضيحية وليست بيانات فعلية.</p></div>`;
    const q = (id) => root.querySelector('#' + id);
    function draw() { q('dxTasks').innerHTML = tasks.map(([t, d], i) => `<div class="dx-task"><span>${t}</span><button type="button" data-i="${i}" class="${d ? '' : 'w'}">${d ? 'مكتمل' : 'قيد المتابعة'}</button></div>`).join(''); }
    q('dxTasks').onclick = (e) => { const b = e.target.closest('[data-i]'); if (b) { tasks[b.dataset.i][1] = !tasks[b.dataset.i][1]; draw(); } };
    draw();
  }

  return { office, _stop: stop };
})();
</script>
<script>
(function () {
  const mount = document.getElementById('demoMount');
  try { window.DEMOS.office(mount); }
  catch (e) { mount.textContent = 'Demo failed to load: ' + e.message; console.error(e); }
})();
</script>
</body>
</html>
