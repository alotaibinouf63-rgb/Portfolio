<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Nouf Al Otaibi Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Nouf Al Otaibi, Office Manager at Security Forces Hospital in Riyadh. Experience, certifications, interactive work samples and CV.">
<meta property="og:type" content="profile">
<meta property="og:title" content="Nouf Al Otaibi, Office Manager">
<meta property="og:description" content="Administrative operations, document control, contract follow-up and reporting dashboards. Experience, certifications, interactive work samples and CV.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Nouf Al Otaibi, Office Manager">
<meta name="twitter:description" content="Administrative operations, document control, contract follow-up and reporting dashboards.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600&family=Noto+Kufi+Arabic:wght@500;600;700&display=swap">
<style>
/* Layout: a white masthead that sets her name beside real work on screen, then sections
   that all open the same way (accent rule, title) with content on the full width.
   Colour: deep navy is the one fill colour (header, contact, footer, buttons, markers, selected
   filters); a light gold touch marks thin accents (header line, heading rules, monogram) and the
   small eyebrow labels; a deep royal blue marks links; backgrounds are neutral and light.
   Order follows a recruiter's questions: who, where, what she built, skills, proof, CV, contact. */
:root{
  --navy:#0B2341; --navy-2:#173A64; --on-navy:#FFFFFF; --on-navy-1:#DDE4EE; --on-navy-2:#B3C0D3; --on-navy-line:rgba(255,255,255,.14);
  --brand:#0B2341; --brand-hover:#1A3D6B; --brand-ink:#FFFFFF;
  --gold:#B08D57; --gold-text:#7F6128; --gold-tint:#F7F1E6; --gold-on-navy:#C9A86A;
  --blue:#1F4E8C; --sky:#EEF1F6;
  --paper:#F6F7F9; --surface:#FFFFFF; --hero:#FFFFFF; --ink:#0F1B2D; --ink-2:#465264; --ink-3:#5A6577;
  --line:#E1E5EB; --line-2:#C9D0DA; --scrim:#0A1628;
  --shadow:0 1px 2px rgba(15,27,45,.05),0 10px 26px -18px rgba(15,27,45,.22);
  --frame-shadow:0 18px 40px -22px rgba(15,27,45,.38);
  --f-en:'IBM Plex Sans','Segoe UI',Arial,sans-serif;
  --f-en-display:'IBM Plex Sans Condensed','IBM Plex Sans','Arial Narrow',Arial,sans-serif;
  --f-ar:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
  --f-ar-display:'Noto Kufi Arabic','IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;
  --wrap:1200px; --r:6px; --r-lg:10px; --hdr:64px; --focus:var(--blue);
  --sp-section:clamp(56px,7vw,96px); --sp-head:clamp(28px,3.4vw,44px); --sp-block:clamp(40px,4.4vw,60px);
  --fs-h2:clamp(30px,3.2vw,42px); --fs-h3:clamp(22px,2.1vw,27px); --fs-sub:20px; --fs-title:17.5px; --fs-lead:clamp(19px,1.8vw,21px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#0E1C31; --navy-2:#182C4A; --on-navy:#FFFFFF; --on-navy-1:#D5DEEB; --on-navy-2:#AEBBD0; --on-navy-line:rgba(255,255,255,.12);
  --brand:#D6E0EE; --brand-hover:#FFFFFF; --brand-ink:#0B1424;
  --gold:#C9A86A; --gold-text:#D9BC86; --gold-tint:#2A2416; --gold-on-navy:#C9A86A;
  --blue:#9DB9E8; --sky:#17253B;
  --paper:#0A1322; --surface:#101B2D; --hero:#0A1322; --ink:#E7ECF3; --ink-2:#AAB5C4; --ink-3:#919DAE;
  --line:#213049; --line-2:#33455F; --scrim:#050B15;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 32px -20px rgba(0,0,0,.7);
  --frame-shadow:0 20px 44px -24px rgba(0,0,0,.75); color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#0E1C31; --navy-2:#182C4A; --on-navy:#FFFFFF; --on-navy-1:#D5DEEB; --on-navy-2:#AEBBD0; --on-navy-line:rgba(255,255,255,.12);
  --brand:#D6E0EE; --brand-hover:#FFFFFF; --brand-ink:#0B1424;
  --gold:#C9A86A; --gold-text:#D9BC86; --gold-tint:#2A2416; --gold-on-navy:#C9A86A;
  --blue:#9DB9E8; --sky:#17253B;
  --paper:#0A1322; --surface:#101B2D; --hero:#0A1322; --ink:#E7ECF3; --ink-2:#AAB5C4; --ink-3:#919DAE;
  --line:#213049; --line-2:#33455F; --scrim:#050B15;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 32px -20px rgba(0,0,0,.7);
  --frame-shadow:0 20px 44px -24px rgba(0,0,0,.75); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-en);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
html[lang="ar"] body{font-family:var(--f-ar);line-height:1.85}
html[lang="ar"]{--fs-h2:clamp(26px,2.7vw,34px);--fs-h3:clamp(19px,1.8vw,23px);--fs-sub:19px;--fs-title:17px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--navy)}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}
a{color:var(--blue);text-underline-offset:3px;text-decoration-thickness:1px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:4px}
section[tabindex="-1"]:focus,article[tabindex="-1"]:focus,main:focus{outline:none}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
.disp{font-family:var(--f-en-display);font-weight:600;letter-spacing:-.01em;line-height:1.08}
html[lang="ar"] .disp{font-family:var(--f-ar-display);font-weight:700;letter-spacing:0;line-height:1.45}
.ico{width:18px;height:18px;flex:none}
html[dir="rtl"] .flip{transform:scaleX(-1)}

.skip{position:fixed;top:-80px;inset-inline-start:12px;z-index:90;background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:var(--r);font-weight:600;text-decoration:none;box-shadow:var(--shadow)}
.skip:focus{top:calc(12px + env(safe-area-inset-top,0px))}

/* ---------- header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--navy);color:var(--on-navy);--focus:var(--on-navy);box-shadow:inset 0 -2px 0 var(--gold-on-navy);transition:box-shadow .2s ease}
.hdr.is-scrolled{box-shadow:inset 0 -2px 0 var(--gold-on-navy),0 8px 18px -12px rgba(0,0,0,.45)}
.hdr-row{display:flex;align-items:center;gap:16px;height:var(--hdr)}
.brand{display:flex;align-items:center;gap:12px;min-width:0;color:inherit;text-decoration:none;font-weight:600;font-size:16px;white-space:nowrap}
.brand span:last-child{overflow:hidden;text-overflow:ellipsis}
.mark{flex:none;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--gold-on-navy);display:grid;place-items:center;font-family:var(--f-en-display);font-size:14px;font-weight:600;letter-spacing:.04em}
.nav{display:flex;gap:2px;margin-inline-start:auto}
.nav a{color:var(--on-navy-2);text-decoration:none;font-size:14.5px;font-weight:500;padding:8px 11px;border-radius:6px;white-space:nowrap}
.nav a:hover{color:var(--on-navy);background:var(--on-navy-line)}
.nav a[aria-current="true"]{color:var(--on-navy);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:9px}
.lang{flex:none;border:1px solid var(--on-navy-2);background:transparent;color:var(--on-navy);border-radius:999px;padding:6px 15px;font-size:14px;font-weight:600;line-height:1.3;cursor:pointer}
.lang:hover{background:var(--on-navy-line)}
.lang:lang(ar){font-family:var(--f-ar)}
.lang:lang(en){font-family:var(--f-en)}
.menu-btn{display:none;flex:none;width:42px;height:42px;place-items:center;border:1px solid var(--on-navy-line);background:transparent;color:var(--on-navy);border-radius:var(--r);cursor:pointer}
.menu-btn svg{width:20px;height:20px}
.menu{position:absolute;inset-inline:0;top:100%;background:var(--navy);border-top:1px solid var(--on-navy-line);box-shadow:0 22px 34px -22px rgba(0,0,0,.55)}
.menu nav{display:grid;padding-block:6px 16px}
.menu a{color:var(--on-navy);text-decoration:none;font-size:17px;padding:13px 2px;border-bottom:1px solid var(--on-navy-line)}
.menu a:last-child{border-bottom:0}
@media (max-width:1060px){.nav{display:none}.lang{margin-inline-start:auto}.menu-btn{display:inline-grid}}
@media (max-width:420px){.brand{font-size:15px;gap:10px}.lang{padding:6px 12px}}

/* ---------- hero */
.hero{background:var(--hero);color:var(--ink);border-bottom:1px solid var(--line);scroll-margin-top:calc(var(--hdr) + env(safe-area-inset-top,0px))}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.02fr);gap:clamp(32px,5vw,72px);align-items:center;padding-block:clamp(40px,6vw,80px) clamp(32px,4vw,48px)}
.hero h1{font-size:clamp(46px,6.6vw,86px);color:var(--brand)}
.hero h1::before{content:"";display:block;width:44px;height:3px;margin-bottom:24px;border-radius:2px;background:var(--gold)}
html[lang="ar"] .hero h1{font-size:clamp(34px,4.3vw,58px)}
.role{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:18px;font-size:15.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-text)}
html[lang="ar"] .role{font-size:clamp(17px,1.7vw,20px);letter-spacing:0;text-transform:none}
.role .sep{width:1px;height:1.15em;background:var(--line-2)}
@media (max-width:560px){.role{flex-direction:column;align-items:flex-start;gap:2px}.role .sep{display:none}}
.hero .lead{margin-top:22px;max-width:33em;font-size:clamp(17px,1.5vw,19.5px);line-height:1.65;color:var(--ink-2)}
html[lang="ar"] .hero .lead{line-height:1.95}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.exhibit-col{display:grid;gap:14px;min-width:0}
.exhibit{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:1.16;border-radius:var(--r-lg);color:inherit;text-decoration:none}
.frame{position:absolute;display:block;aspect-ratio:1340/1060;max-width:100%;border-radius:8px;overflow:hidden;background:#FFFFFF;border:1px solid var(--line);box-shadow:var(--frame-shadow);transition:transform .35s ease}
.frame img{display:block;width:100%;height:100%;object-fit:cover;object-position:top center}
.frame.back{top:0;inset-inline-end:0;width:74%}
.frame.front{bottom:0;inset-inline-start:0;width:80%}
.exhibit:hover .frame.front{transform:translateY(-4px)}
.exhibit:hover .frame.back{transform:translateY(3px)}
.ex-cap{font-size:13.5px;line-height:1.55;color:var(--ink-3);max-width:44em}
.facts{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line-2)}
.facts>div{padding:18px 20px 2px;border-inline-start:1px solid var(--line);min-width:0}
.facts>div:first-child{border-inline-start:0;padding-inline-start:0}
.facts dt{font-size:13.5px;color:var(--ink-3)}
.facts dd{margin-top:4px;font-size:16px;font-weight:600;color:var(--ink)}
@media (max-width:980px){.hero-grid{grid-template-columns:minmax(0,1fr)}.exhibit{max-width:620px}}
@media (max-width:760px){
  .facts{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px}
  .facts>div{border-inline-start:0;padding:14px 0;border-bottom:1px solid var(--line)}
  .facts>div:last-child{grid-column:1/-1;border-bottom:0}
}

/* ---------- buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:10px 20px;border-radius:var(--r);border:1px solid transparent;font-size:15.5px;font-weight:600;line-height:1.25;text-decoration:none;cursor:pointer;white-space:nowrap;transition:background-color .15s ease,border-color .15s ease,color .15s ease}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:var(--brand-hover)}
.btn-line{background:var(--surface);color:var(--brand);border-color:var(--line-2)}
.btn-line:hover{border-color:var(--brand);background:var(--sky)}
.btn-text{background:transparent;color:var(--brand);padding-inline:8px}
.btn-text:hover{text-decoration:underline;text-underline-offset:4px}
.btn-sm{min-height:38px;padding:7px 14px;font-size:14.5px}
@media (max-width:420px){.cta .btn{flex:1 1 auto}}

/* ---------- sections: one header pattern and one spacing scale; content uses the full width */
.sec{padding-block:var(--sp-section);scroll-margin-top:calc(var(--hdr) + env(safe-area-inset-top,0px))}
.sec+.sec{border-top:1px solid var(--line)}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:end;gap:14px 64px;margin-bottom:var(--sp-head)}
.sec-head h2{font-size:var(--fs-h2);color:var(--brand)}
.sec-head h2::before{content:"";display:block;width:32px;height:3px;margin-bottom:16px;border-radius:2px;background:var(--gold)}
.sec-head .desc{max-width:34em;color:var(--ink-2);font-size:16.5px;line-height:1.6;text-wrap:pretty}
html[lang="ar"] .sec-head .desc{line-height:1.85}
.sec-head .data-note{grid-column:1/-1;margin-top:6px}
.block{margin-top:var(--sp-block);scroll-margin-top:calc(var(--hdr) + 24px)}
.h-sub{margin-bottom:18px;font-size:var(--fs-sub);font-weight:600;line-height:1.35;color:var(--ink)}
html[lang="ar"] .h-sub{font-weight:700}
.label{font-size:13.5px;font-weight:600;color:var(--ink-3)}
@media (max-width:860px){.sec-head{grid-template-columns:minmax(0,1fr);align-items:start}}

/* about */
.about-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px 72px;align-items:start}
.about-text{display:grid;gap:18px;max-width:44em}
.about-text .first{font-size:var(--fs-lead);line-height:1.55;color:var(--ink)}
html[lang="ar"] .about-text .first{line-height:1.9}
.about-text p:not(.first){color:var(--ink-2)}
.focus{border-top:1px solid var(--line)}
.focus li{display:flex;gap:12px;align-items:baseline;padding-block:12px;border-bottom:1px solid var(--line);color:var(--ink);font-size:16px}
.focus li::before{content:"";flex:none;width:6px;height:6px;background:var(--brand);transform:translateY(-2px)}
@media (max-width:900px){.about-grid{grid-template-columns:minmax(0,1fr)}}

/* experience */
.timeline{position:relative;display:grid}
.timeline::before{content:"";position:absolute;top:12px;bottom:12px;inset-inline-start:7px;width:1px;background:var(--line-2)}
.job{position:relative;padding-inline-start:42px;padding-bottom:48px;scroll-margin-top:calc(var(--hdr) + 24px)}
.job:last-child{padding-bottom:0}
.job::before{content:"";position:absolute;inset-inline-start:0;top:7px;width:15px;height:15px;border-radius:50%;background:var(--paper);border:2px solid var(--brand)}
.job.current::before{background:var(--brand)}
.job-top{display:grid;justify-items:start;align-content:start}
.when{font-size:14.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.when b{color:var(--ink);font-weight:600}
.when .place{margin-inline-start:12px;padding-inline-start:12px;border-inline-start:1px solid var(--line-2)}
.job h3{margin-top:6px;font-size:var(--fs-h3)}
.org{margin-top:4px;color:var(--blue);font-weight:600;font-size:17px}
.logo-chip{display:grid;place-items:center;margin-top:14px;background:#FFFFFF;border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.logo-chip img{display:block;height:42px;width:auto;max-width:none}
.duties{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 56px;margin-top:24px}
.duties h4{margin-bottom:8px;font-size:var(--fs-title);font-weight:600;color:var(--ink)}
.duties ul,.ach ul,.skill ul,.case-body ul{display:grid;gap:7px}
.dash li{position:relative;padding-inline-start:17px;color:var(--ink-2);font-size:15.5px;line-height:1.55}
.dash li::before{content:"";position:absolute;inset-inline-start:0;top:calc(.775em - 1px);width:8px;height:2px;border-radius:1px;background:var(--brand)}
html[lang="ar"] .dash li{line-height:1.85}
html[lang="ar"] .dash li::before{top:calc(.925em - 1px)}
.ach{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(22px,3vw,32px)}
.ach ul{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 48px}
.ach li{position:relative;padding-inline-start:22px;color:var(--ink-2);font-size:15.5px}
.ach li::before{content:"";position:absolute;inset-inline-start:0;top:.6em;width:6px;height:6px;background:var(--brand)}
html[lang="ar"] .ach li::before{top:.75em}
.extra{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 32px}
.extra>div{display:grid;gap:4px;align-content:start;border-top:2px solid var(--brand);padding-top:14px}
.extra .t{font-weight:600;color:var(--ink)}
.extra p{color:var(--ink-2);font-size:15.5px}
.extra .btn{justify-self:start;margin-top:10px}
@media (max-width:760px){.duties,.ach ul,.extra{grid-template-columns:minmax(0,1fr)}}

/* skills */
.matrix{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.skill{display:flex;flex-direction:column;gap:14px;background:var(--surface);padding:24px 26px;min-width:0}
.skill h3{font-size:var(--fs-title);font-weight:600;line-height:1.35}
.skill li{position:relative;padding-inline-start:16px;color:var(--ink-2);font-size:15.5px;line-height:1.5}
.skill li::before{content:"";position:absolute;inset-inline-start:0;top:.62em;width:6px;height:6px;background:var(--brand)}
html[lang="ar"] .skill li{line-height:1.8}
html[lang="ar"] .skill li::before{top:.8em}
.evidence{margin-top:auto;padding-top:12px;border-top:1px dashed var(--line-2);font-size:14px;color:var(--ink-3)}
.evidence a{font-weight:500}
@media (max-width:1000px){.matrix{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.matrix{grid-template-columns:minmax(0,1fr)}}

/* certificates */
.pro{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.pro-card{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;min-width:0}
.pro-img{display:grid;place-items:center;width:100%;min-width:0;padding:18px;border:0;border-inline-end:1px solid var(--line);background:var(--sky);cursor:zoom-in}
.pro-img img{display:block;width:100%;height:auto;max-width:100%;aspect-ratio:1700/1279;object-fit:cover;border-radius:4px;background:#FFFFFF;box-shadow:0 8px 20px -12px rgba(15,27,45,.35)}
.pro-text{display:grid;gap:10px;align-content:start;padding:24px}
.badge{justify-self:start;font-size:13px;font-weight:600;color:var(--gold-text);background:var(--gold-tint);border-radius:999px;padding:2px 11px}
.pro-text h4{font-size:var(--fs-title);line-height:1.35}
.issuer{color:var(--ink-2);font-size:15px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 16px;font-size:14.5px}
.kv dt{color:var(--ink-3)}
.kv dd{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pro-text .btn{justify-self:start;margin-top:4px}
.courses-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
.courses-head .h-sub{margin:0}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:6px 14px;font-size:14px;line-height:1.35;cursor:pointer}
.filters button:hover{border-color:var(--brand);color:var(--brand)}
.filters button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.filters .n{margin-inline-start:6px;opacity:.72;font-variant-numeric:tabular-nums}
.course-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:32px;border-top:1px solid var(--line);scroll-margin-top:calc(var(--hdr) + 24px)}
.course{border-bottom:1px solid var(--line);min-width:0}
.course-btn{display:grid;grid-template-columns:88px minmax(0,1fr);gap:14px;align-items:center;width:100%;padding:14px 0;border:0;background:none;color:inherit;text-align:start;cursor:pointer}
.course-btn:hover .c-title{color:var(--blue)}
.c-thumb{display:block;aspect-ratio:4/3;max-width:100%;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:#FFFFFF}
.c-thumb img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.c-text{display:grid;gap:2px;min-width:0}
.c-title{font-weight:600;font-size:15.5px;line-height:1.4;color:var(--ink);transition:color .15s ease}
.c-meta{font-size:14px;color:var(--ink-2);line-height:1.45}
.c-date{font-size:13.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.c-verify{display:inline-flex;align-items:center;gap:5px;margin:-4px 0 14px;margin-inline-start:102px;font-size:13.5px;font-weight:500}
.c-verify svg{width:14px;height:14px}
@media (max-width:1100px){.course-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1000px){.pro{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){.course-list{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){.pro-card{grid-template-columns:minmax(0,1fr)}.pro-img{border-inline-end:0;border-bottom:1px solid var(--line)}}
@media (max-width:420px){.course-btn{grid-template-columns:76px minmax(0,1fr);gap:12px}.c-verify{margin-inline-start:88px}}

/* work */
.data-note{display:flex;align-items:flex-start;gap:12px;padding:14px 18px;background:var(--sky);border-inline-start:3px solid var(--brand);border-radius:4px}
.data-note svg{width:19px;height:19px;flex:none;margin-top:.24em;color:var(--brand)}
.data-note p{min-width:0;font-size:15px;line-height:1.65;color:var(--ink)}
html[lang="ar"] .data-note p{line-height:1.85}
.cases{display:grid;gap:32px}
.case{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);scroll-margin-top:calc(var(--hdr) + env(safe-area-inset-top,0px) + 20px)}
.case-top{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(0,1fr)}
.case-media{display:grid;gap:12px;align-content:start;padding:clamp(16px,2.4vw,28px);background:var(--sky);border-inline-end:1px solid var(--line);min-width:0}
.shot{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:1340/1000;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#FFFFFF;cursor:zoom-in}
.shot img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.zoom-tag{position:absolute;bottom:10px;inset-inline-end:10px;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:4px;background:rgba(11,35,65,.9);color:#FFFFFF;font-size:13px;font-weight:500}
.zoom-tag svg{width:15px;height:15px}
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.thumb{width:88px;aspect-ratio:4/3;max-width:100%;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#FFFFFF;cursor:zoom-in}
.thumb img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.case-info{display:flex;flex-direction:column;gap:16px;padding:clamp(22px,3vw,36px);min-width:0}
.kind{font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-text)}
html[lang="ar"] .kind{font-size:14px;letter-spacing:0;text-transform:none}
.case h3{font-size:var(--fs-h3);color:var(--ink)}
.goal{color:var(--ink-2);font-size:16px}
.case-facts{display:grid;gap:14px}
.case-facts dt{margin-bottom:7px;font-size:13.5px;font-weight:600;color:var(--ink-3)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags li{font-size:13.5px;line-height:1.4;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink-2)}
.tags.skills li{border-color:transparent;background:var(--sky);color:var(--ink)}
.case-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:4px}
.case-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:26px 48px;padding:clamp(22px,3vw,32px) clamp(22px,3vw,36px);border-top:1px solid var(--line)}
.case-body h4{margin-bottom:8px;font-size:var(--fs-title);font-weight:600;color:var(--ink)}
.case-body p{font-size:15.5px;color:var(--ink-2)}
@media (max-width:980px){.case-top{grid-template-columns:minmax(0,1fr)}.case-media{border-inline-end:0;border-bottom:1px solid var(--line)}.case-body{grid-template-columns:minmax(0,1fr)}}

/* cv */
.cv{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);grid-template-areas:"pages side";gap:32px 64px;align-items:center}
.cv-pages{grid-area:pages;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.6vw,18px)}
.page{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:595/842;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#FFFFFF;box-shadow:var(--shadow);cursor:zoom-in}
.page img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.page .pg{position:absolute;bottom:8px;inset-inline-start:8px;padding:2px 8px;border-radius:4px;background:rgba(11,35,65,.9);color:#FFFFFF;font-size:12.5px;font-variant-numeric:tabular-nums}
.cv-side{grid-area:side;display:grid;gap:12px;justify-items:start;align-content:center}
.cv-side .h-sub{margin:0}
.cv-meta{color:var(--ink-2)}
.cv-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
@media (max-width:860px){.cv{grid-template-columns:minmax(0,1fr);grid-template-areas:"side" "pages"}}

/* contact + footer */
.contact{background:var(--navy);color:var(--on-navy);--focus:var(--on-navy);padding-block:clamp(56px,8vw,100px);scroll-margin-top:calc(var(--hdr) + env(safe-area-inset-top,0px))}
.contact-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:32px 72px;align-items:start}
.contact h2{font-size:clamp(36px,4.2vw,56px);color:var(--on-navy)}
.contact h2::before{content:"";display:block;width:32px;height:3px;margin-bottom:16px;border-radius:2px;background:var(--gold-on-navy)}
html[lang="ar"] .contact h2{font-size:clamp(30px,3.4vw,44px)}
.contact .lead{margin-top:16px;max-width:28em;font-size:18px;color:var(--on-navy-2)}
.ledger{border-top:1px solid var(--on-navy-line)}
.ledger li{display:grid;grid-template-columns:130px minmax(0,1fr) auto;align-items:center;gap:8px 20px;padding-block:16px;border-bottom:1px solid var(--on-navy-line)}
.ledger .k{font-size:14px;color:var(--on-navy-2)}
.ledger .v{min-width:0;font-size:17px;font-weight:500;color:var(--on-navy);overflow-wrap:anywhere}
.ledger .v.ltr{text-align:left}
html[dir="rtl"] .ledger .v.ltr{text-align:right}
.ledger a.v{text-decoration:underline;text-decoration-color:var(--on-navy-2);text-underline-offset:4px}
.acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:5px 11px;border-radius:6px;border:1px solid var(--on-navy-2);background:transparent;color:var(--on-navy);font-size:13.5px;font-weight:500;text-decoration:none;white-space:nowrap;cursor:pointer}
.chip:hover{background:var(--on-navy-line)}
.chip svg{width:15px;height:15px}
@media (max-width:860px){.contact-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.ledger li{grid-template-columns:minmax(0,1fr)}.acts{justify-content:flex-start}}
.foot{background:var(--navy);color:var(--on-navy-2);border-top:1px solid var(--on-navy-line);padding-block:28px 40px;font-size:14px;line-height:1.6}
.foot .wrap{display:grid;gap:8px}
.foot p:last-child{color:var(--on-navy-1)}

/* ---------- viewers */
.overlay{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;background:var(--scrim);color:#E6ECF5;--focus:#FFFFFF;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.overlay[hidden]{display:none!important}
.ov-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov-head{flex:1 1 260px;min-width:0;display:grid;gap:2px}
.ov-title{font-size:16px;font-weight:600;color:#FFFFFF;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-sub{font-size:13px;color:#B3C0D3}
.ov-actions{display:flex;flex-wrap:wrap;gap:8px;margin-inline-start:auto}
.ov-btn{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:6px 13px;border-radius:7px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.08);color:#FFFFFF;font-size:14px;font-weight:500;line-height:1.2;text-decoration:none;cursor:pointer;white-space:nowrap}
.ov-btn:hover{background:rgba(255,255,255,.16)}
.ov-btn svg{width:17px;height:17px;flex:none}
.ov-btn.close{background:#FFFFFF;color:#0B2341;border-color:#FFFFFF}
.ov-count{font-size:13.5px;color:#B3C0D3;font-variant-numeric:tabular-nums}
@media (max-width:560px){.ov-bar{gap:8px 12px;padding-block:10px}.ov-sub{font-size:12.5px}.ov-btn:not(.close) .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}}
.lb-stage{flex:1;min-height:0;overflow:auto;display:grid;place-items:center;padding:4px 16px 20px}
.lb-stage img{max-width:100%;max-height:calc(100dvh - 120px);background:#FFFFFF;border-radius:4px;box-shadow:0 24px 60px rgba(0,0,0,.5);cursor:zoom-in}
.lb-stage.zoomed{place-items:start}
.lb-stage.zoomed img{max-width:none;max-height:none;width:max(170%,1400px);cursor:zoom-out}
.demo-stage{position:relative;flex:1;min-height:0;margin-inline:max(10px,env(safe-area-inset-left,0px)) max(10px,env(safe-area-inset-right,0px));margin-bottom:10px;border-radius:8px;overflow:hidden;background:#F6F7F9}
.demo-stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#FFFFFF}
.demo-status{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:15.5px;color:#465264}
.demo-status[hidden]{display:none}
#demo:fullscreen{background:#0A1628}
#demo:fullscreen .demo-stage{margin:0;border-radius:0}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:200;transform:translateX(-50%);max-width:calc(100vw - 32px);padding:10px 16px;border-radius:var(--r);background:var(--ink);color:var(--paper);font-size:14.5px;box-shadow:var(--shadow)}

.to-top{position:fixed;z-index:45;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-end:max(20px,env(safe-area-inset-left,0px),env(safe-area-inset-right,0px));display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--navy);color:var(--on-navy);border:1px solid var(--on-navy-line);box-shadow:var(--shadow);text-decoration:none;--focus:var(--blue)}
.to-top:hover{background:var(--navy-2)}
.to-top svg{width:20px;height:20px}

/* ---------- one load sequence for the masthead */
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes settle{from{opacity:.001;transform:translateY(22px)}to{opacity:1;transform:none}}
.intro .hero-text>*{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.intro .hero-text>*:nth-child(2){animation-delay:.04s}
.intro .hero-text>*:nth-child(3){animation-delay:.08s}
.intro .hero-text>*:nth-child(4){animation-delay:.12s}
.intro .frame.back{animation:settle .55s .06s cubic-bezier(.2,.7,.2,1) both}
.intro .frame.front{animation:settle .55s .14s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
